<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HIN Gateway – Migrationsassistent</title>
<meta name="description" content="Geführte Migration vom MGW auf das HIN Gateway. Single- und Multi-Domain, verschiedene Mailumgebungen und VM-Plattformen.">
<style>
:root{
  --paper:#F6F5F2;
  --surface:#FFFFFF;
  --ink:#132029;
  --ink-2:#42545F;
  --muted:#6B7C87;
  --rule:#D9E1E5;
  --rule-soft:#F2EFE9;
  --accent:#F39900;
  --accent-ink:#7A4700;
  --accent-soft:#FFF3DF;
  --done:#1C7A52;
  --done-soft:#E3F1EA;
  --warn:#8F5D00;
  --warn-soft:#FBF0DA;
  --danger:#A32A24;
  --danger-soft:#FAE8E6;
  --term:#0E1D26;
  --term-ink:#DCE7EC;
  --ui:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
  --rail:320px;
  --topH:56px;
}
*{box-sizing:border-box}
[hidden]{display:none !important}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--paper);color:var(--ink);
  font-family:var(--ui);font-size:16px;line-height:1.55;
  font-variant-numeric:tabular-nums;
}
a{color:var(--accent-ink);text-underline-offset:2px}
a:hover{color:var(--accent)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}

/* ---------- Topbar ---------- */
.top{
  position:sticky;top:0;z-index:40;background:var(--surface);
  border-top:4px solid var(--accent);
  border-bottom:1px solid var(--rule);
}
.top-in{
  max-width:1360px;margin:0 auto;padding:10px 20px;
  display:flex;align-items:center;gap:16px;
}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0}
.brand:before{content:"";width:10px;height:10px;border-radius:2px;background:var(--accent);flex:0 0 auto;align-self:center}
.brand b{font-size:15px;font-weight:650;letter-spacing:-.01em;white-space:nowrap}
.brand span{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{
  display:inline-flex;align-items:center;gap:7px;padding:5px 11px;border-radius:999px;
  border:1px solid var(--rule);background:var(--surface);font-size:13px;cursor:pointer;
}
.pill:hover{border-color:var(--accent);color:var(--accent-ink)}
.pill.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-ink)}
.pill .dot{width:8px;height:8px;border-radius:50%;background:var(--accent)}
.menu-btn{display:none}
.langs{margin-left:auto;display:flex;gap:1px;border:1px solid var(--rule);border-radius:999px;padding:2px;background:var(--surface);flex:0 0 auto}
.langs button{
  border:0;background:none;cursor:pointer;font-size:12.5px;font-weight:560;letter-spacing:.02em;
  color:var(--muted);padding:4px 10px;border-radius:999px;line-height:1.3;
}
.langs button:hover{color:var(--ink)}
.langs button.on{background:var(--accent);color:var(--ink)}
.top-right{display:flex;align-items:center;gap:10px}

.bar{height:3px;background:var(--rule-soft)}
.bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .35s ease}

/* ---------- Layout ---------- */
.wrap{max-width:1360px;margin:0 auto;padding:0 20px;display:flex;gap:34px;align-items:flex-start}
.rail{
  width:var(--rail);flex:0 0 var(--rail);position:sticky;top:var(--topH);
  max-height:calc(100vh - var(--topH) - 14px);overflow:auto;padding:22px 0 40px;
}
.main{flex:1 1 auto;min-width:0;padding:26px 0 90px;max-width:860px}

/* ---------- Rail ---------- */
.prog{
  background:var(--surface);border:1px solid var(--rule);border-radius:10px;
  padding:14px 15px;margin-bottom:18px;
}
.prog-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.prog-h b{font-size:28px;font-weight:640;letter-spacing:-.02em;line-height:1.1}
.prog-h span{font-size:12.5px;color:var(--muted)}
.prog-track{height:6px;border-radius:3px;background:var(--rule-soft);margin-top:10px;overflow:hidden}
.prog-track i{display:block;height:100%;width:0;background:var(--done);transition:width .35s ease}

.phase{margin:0 0 6px}
.phase-h{
  font-size:12.5px;color:var(--muted);padding:12px 12px 5px;
  display:flex;align-items:center;gap:8px;
}
.phase-h em{font-style:normal;color:var(--ink-2)}
.nav{list-style:none;margin:0;padding:0}
.nav li{margin:0}
.nav button{
  width:100%;text-align:left;background:none;border:0;cursor:pointer;
  display:grid;grid-template-columns:26px 1fr;gap:10px;align-items:start;
  padding:7px 12px;border-radius:8px;font-size:14.5px;line-height:1.35;color:var(--ink-2);
}
.nav button:hover{background:var(--surface);color:var(--ink)}
.nav button[aria-current="true"]{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:inset 2px 0 0 var(--accent)}
.nav .n{
  font-family:var(--mono);font-size:12px;color:var(--muted);
  border:1px solid var(--rule);border-radius:5px;text-align:center;
  padding:1px 0;background:var(--surface);
}
.nav button[aria-current="true"] .n{border-color:var(--accent);color:var(--accent-ink)}
.nav .done .n{background:var(--done-soft);border-color:#BEDBCC;color:var(--done)}
.nav .lbl{padding-top:1px}
.nav .cnt{font-family:var(--mono);font-size:11.5px;color:var(--muted);display:block;margin-top:1px}

.cutline{
  display:flex;align-items:center;gap:9px;margin:12px 12px 8px;
  font-size:12px;color:var(--danger);
}
.cutline:before,.cutline:after{content:"";height:1px;background:currentColor;opacity:.35;flex:1}
.cutline span{white-space:nowrap}

.rail-tools{display:flex;flex-direction:column;gap:8px;margin:18px 12px 0}
.rail-tools .m-only{display:none}
.tool{
  text-align:left;background:var(--surface);border:1px solid var(--rule);border-radius:9px;
  padding:10px 12px;cursor:pointer;font-size:14px;
}
.tool:hover{border-color:var(--accent);color:var(--accent-ink)}
.tool small{display:block;color:var(--muted);font-size:12.5px;margin-top:1px}
.tool:hover small{color:var(--muted)}

/* ---------- Gate ---------- */
.gate{max-width:900px;margin:0 auto;padding:48px 20px 80px}
.gate h1{font-size:clamp(30px,4.6vw,44px);line-height:1.08;letter-spacing:-.025em;font-weight:660;margin:0 0 14px}
.gate .sub{font-size:17.5px;color:var(--ink-2);max-width:60ch;margin:0 0 6px}
.gate .meta{font-size:13.5px;color:var(--muted);margin:0 0 34px}
.gate h2{font-size:19px;font-weight:620;letter-spacing:-.01em;margin:0 0 6px}
.gate .q{font-size:15px;color:var(--ink-2);max-width:66ch;margin:0 0 18px}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.choice{
  position:relative;background:var(--surface);border:1px solid var(--rule);border-radius:12px;
  padding:20px 20px 18px;text-align:left;cursor:pointer;display:block;
  transition:border-color .15s ease,transform .15s ease,box-shadow .15s ease,background .15s ease;
}
.choice:hover{border-color:var(--accent);transform:translateY(-2px)}
.choice.on{
  border:3px solid var(--done);background:linear-gradient(180deg,var(--surface),var(--done-soft));
  box-shadow:0 0 0 3px rgba(28,122,82,.10);padding:18px 18px 16px;
}
.choice.on::after{
  content:"✓";position:absolute;top:12px;right:12px;width:26px;height:26px;border-radius:50%;
  display:grid;place-items:center;background:var(--done);color:#fff;font-weight:800;font-size:15px;
}
.choice.on .tag{color:var(--done);background:var(--done-soft)}
.choice .tag{font-family:var(--mono);font-size:12px;color:var(--accent-ink);background:var(--accent-soft);border-radius:5px;padding:2px 7px;display:inline-block}
.choice h3{font-size:19px;font-weight:620;letter-spacing:-.01em;margin:10px 0 8px}
.choice p{font-size:14.5px;color:var(--ink-2);margin:0 0 12px}
.choice ul{margin:0;padding-left:17px;font-size:13.5px;color:var(--muted)}
.choice li{margin:3px 0}
.gate .later{font-size:13.5px;color:var(--muted);margin-top:22px}
.gate-start{
  margin:22px 0 26px;padding:16px 18px;border:1px solid #E5C78F;border-left:5px solid var(--accent);
  border-radius:10px;background:var(--accent-soft);color:var(--ink-2);font-size:15px;
}
.gate-start b{color:var(--ink)}
.gate-progress{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0 0 30px}
.gate-progress-step{
  display:flex;align-items:center;gap:9px;padding:9px 11px;border:1px solid var(--rule);border-radius:9px;
  background:var(--surface);font-size:13px;color:var(--muted);min-width:0;
}
.gate-progress-step .gp-n{
  width:23px;height:23px;display:grid;place-items:center;border-radius:50%;border:1px solid var(--rule);
  font-family:var(--mono);font-size:11px;flex:0 0 auto;background:var(--paper);
}
.gate-progress-step.active{border-color:var(--accent);color:var(--ink);box-shadow:0 0 0 2px var(--accent-soft)}
.gate-progress-step.active .gp-n{border-color:var(--accent);background:var(--accent);color:#fff}
.gate-progress-step.done{border-color:#B9D9C8;color:var(--done);background:var(--done-soft)}
.gate-progress-step.done .gp-n{border-color:var(--done);background:var(--done);color:#fff}
.question-kicker{display:block;font-family:var(--mono);font-size:11.5px;font-weight:700;letter-spacing:.035em;color:var(--accent-ink);margin:0 0 5px;text-transform:uppercase}
.gate-question{scroll-margin-top:82px}

/* ---------- Step ---------- */
.crumb{font-size:13px;color:var(--muted);margin:0 0 8px}
.crumb .num{font-family:var(--mono);color:var(--accent-ink)}
.step h1{font-size:clamp(24px,3.2vw,32px);line-height:1.15;letter-spacing:-.022em;font-weight:640;margin:0 0 12px}
.lead{font-size:17px;color:var(--ink-2);max-width:68ch;margin:0 0 24px}
.step h2{font-size:17.5px;font-weight:620;letter-spacing:-.01em;margin:32px 0 10px;padding-top:2px}
.step p{max-width:70ch;margin:0 0 14px}
.step ul.plain{max-width:70ch;padding-left:19px;margin:0 0 16px}
.step ul.plain li{margin:5px 0}
.hint{font-size:13.5px;color:var(--muted);max-width:70ch;margin:-6px 0 14px}

/* tasks */
.tasks{list-style:none;margin:0 0 18px;padding:0;border-top:1px solid var(--rule)}
.tasks li{border-bottom:1px solid var(--rule)}
.task-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:0 2px}
.tasks label{display:grid;grid-template-columns:22px 1fr;gap:12px;align-items:start;padding:11px 0;cursor:pointer}
.tasks input{
  appearance:none;-webkit-appearance:none;margin:2px 0 0;width:19px;height:19px;
  border:1.5px solid #B6C4CB;border-radius:5px;background:var(--surface);cursor:pointer;
  display:grid;place-content:center;
}
.tasks input:checked{background:var(--done);border-color:var(--done)}
.tasks input:checked:after{content:"";width:10px;height:6px;border:2px solid #fff;border-top:0;border-right:0;transform:rotate(-45deg) translateY(-1px)}
.tasks .txt{max-width:66ch}
.tasks input:checked + .txt{color:var(--muted);text-decoration:line-through;text-decoration-color:#BCC9D0}
.tasks li.na .txt{color:var(--muted)}
.na-btn{border:1px solid var(--rule);background:var(--surface);color:var(--muted);border-radius:6px;padding:4px 8px;font-size:12px;cursor:pointer;white-space:nowrap}
.na-btn:hover{border-color:var(--warn);color:var(--warn)}
.na-btn.on{background:var(--warn-soft);border-color:#D9B56A;color:var(--warn);font-weight:600}
.tasks .v{
  font-family:var(--mono);font-size:11px;border:1px solid var(--rule);border-radius:4px;
  padding:0 5px;margin-left:7px;color:var(--muted);white-space:nowrap;vertical-align:1px;
}

/* notes */
.note{
  border:1px solid var(--rule);border-left:3px solid var(--muted);border-radius:0 9px 9px 0;
  background:var(--surface);padding:13px 16px;margin:0 0 18px;max-width:70ch;font-size:14.8px;
}
.note b{display:block;font-size:14px;font-weight:640;margin-bottom:3px}
.note.warn{border-left-color:var(--warn);background:var(--warn-soft);border-color:#EFDFBE}
.note.warn b{color:var(--warn)}
.note.danger{border-left-color:var(--danger);background:var(--danger-soft);border-color:#F0D3D0}
.note.danger b{color:var(--danger)}
.note.info{border-left-color:var(--accent);background:var(--accent-soft);border-color:#CADEE0}
.note.info b{color:var(--accent-ink)}
.note p{margin:0 0 8px;max-width:none}
.note p:last-child{margin:0}

/* commands */
.cmd{margin:0 0 18px;border-radius:9px;overflow:hidden;border:1px solid #24333D}
.cmd-h{
  background:#1A2B35;color:#9FB4BF;font-size:12.5px;padding:7px 12px;
  display:flex;align-items:center;gap:10px;
}
.cmd-h .where{font-family:var(--mono)}
.cmd-h button{
  margin-left:auto;background:transparent;border:1px solid #3A4C57;color:#C7D6DE;
  border-radius:6px;padding:2px 9px;font-size:12px;cursor:pointer;
}
.cmd-h button:hover{background:#24343E;color:#fff}
.cmd pre{
  margin:0;background:var(--term);color:var(--term-ink);padding:12px 14px;
  font-family:var(--mono);font-size:13.5px;line-height:1.7;overflow-x:auto;
}
.cmd .c{color:#7D95A1}
.ph{
  color:#F0C36B;border-bottom:1px dashed #A57C2A;padding-bottom:1px;
}
.ph.set{color:#7FD6C0;border-bottom-color:transparent;background:rgba(127,214,192,.10);border-radius:3px;padding:0 2px}
code.inl{font-family:var(--mono);font-size:.9em;background:var(--rule-soft);border-radius:4px;padding:1px 5px}
code.inl .ph{color:var(--warn);border-bottom-color:var(--warn)}
code.inl .ph.set{color:var(--accent-ink);background:var(--accent-soft)}

/* tables */
.tbl{width:100%;border-collapse:collapse;margin:0 0 18px;font-size:14.5px;background:var(--surface)}
.tbl th,.tbl td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--rule);vertical-align:top}
.tbl th{font-size:12.5px;color:var(--muted);font-weight:600;background:var(--rule-soft);border-bottom-color:var(--rule)}
.tbl td.m{font-family:var(--mono);font-size:13px;white-space:nowrap}
.tbl tr:last-child td{border-bottom:0}
.tbl-wrap{border:1px solid var(--rule);border-radius:9px;overflow-x:auto;margin:0 0 18px;-webkit-overflow-scrolling:touch}
.tbl-wrap .tbl{min-width:460px}
.tbl-wrap .tbl{margin:0}

/* net list */
.nets{
  display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px;padding:14px;
  background:var(--surface);border:1px solid var(--rule);border-radius:9px;
}
.nets code{font-family:var(--mono);font-size:13px;background:var(--rule-soft);border-radius:5px;padding:3px 8px}

/* nav buttons */
.pager{display:flex;gap:12px;margin-top:38px;padding-top:22px;border-top:1px solid var(--rule)}
.btn{
  background:var(--accent);color:var(--ink);border:1px solid var(--accent);border-radius:8px;
  padding:10px 18px;font-size:15px;font-weight:560;cursor:pointer;
}
.btn:hover{background:var(--accent-ink);color:#fff}
.btn.ghost{background:var(--surface);color:var(--ink-2);border-color:var(--rule)}
.btn.ghost:hover{border-color:var(--accent);color:var(--accent-ink);background:var(--surface)}
.btn[disabled]{opacity:.4;cursor:default}
.pager .sp{margin-left:auto}

/* dialogs */
dialog{
  border:1px solid var(--rule);border-radius:12px;padding:0;max-width:640px;width:calc(100% - 32px);
  color:var(--ink);background:var(--surface);box-shadow:0 18px 50px rgba(19,32,41,.22);
}
dialog::backdrop{background:rgba(19,32,41,.42)}
.dlg-h{display:flex;align-items:baseline;gap:12px;padding:18px 20px 10px;border-bottom:1px solid var(--rule)}
.dlg-h h2{font-size:18px;font-weight:640;margin:0;letter-spacing:-.01em}
.dlg-h p{margin:0;font-size:13.5px;color:var(--muted)}
.dlg-b{padding:16px 20px;max-height:64vh;overflow:auto}
.dlg-f{display:flex;gap:10px;padding:14px 20px;border-top:1px solid var(--rule);background:var(--rule-soft)}
.dlg-f .sp{margin-left:auto}
.x{background:none;border:0;font-size:20px;line-height:1;color:var(--muted);cursor:pointer;margin-left:auto;padding:0 2px}
.x:hover{color:var(--ink)}

.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px 16px}
.fld label{display:block;font-size:13px;color:var(--ink-2);margin-bottom:3px}
.fld input{
  width:100%;padding:8px 10px;border:1px solid var(--rule);border-radius:7px;
  font-family:var(--mono);font-size:14px;background:var(--surface);color:var(--ink);
}
.fld input:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.fld small{display:block;font-size:12px;color:var(--muted);margin-top:3px}

.fld select,.fld textarea{
  width:100%;padding:8px 10px;border:1px solid var(--rule);border-radius:7px;
  font-family:var(--ui);font-size:14px;background:var(--surface);color:var(--ink);
}
.fld select:focus,.fld textarea:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.domain-setup{grid-column:1/-1;border-top:1px solid var(--rule);padding-top:16px;margin-top:4px}
.domain-setup h3{font-size:16px;margin:0 0 5px}
.domain-setup .intro{font-size:13.5px;color:var(--muted);margin:0 0 12px}
.mode-row{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 14px}
.mode-btn{border:1px solid var(--rule);background:var(--surface);border-radius:8px;padding:8px 11px;cursor:pointer;font-size:13.5px;text-align:left}
.mode-btn:hover{border-color:var(--accent)}
.mode-btn.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-ink);font-weight:600}
.mode-btn small{display:block;color:var(--muted);font-weight:400;margin-top:2px;max-width:46ch}
.domain-card{border:1px solid var(--rule);border-radius:9px;background:var(--rule-soft);padding:12px;margin:10px 0}
.domain-card-h{display:flex;align-items:center;gap:10px;margin-bottom:9px}
.domain-card-h b{font-size:14px}
.domain-card-h button{margin-left:auto;border:0;background:none;color:var(--danger);cursor:pointer;font-size:12.5px}
.domain-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px}
.domain-grid .wide{grid-column:1/-1}
.gate-compare{margin:22px 0 0;max-width:900px}
.gate-compare h3{font-size:16px;margin:0 0 8px}
.domain-badge{font-family:var(--mono);font-size:11.5px;color:var(--accent-ink);background:var(--accent-soft);border-radius:4px;padding:2px 6px;margin-right:7px}

.toast{
  position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(8px);
  background:var(--ink);color:#fff;padding:9px 16px;border-radius:8px;font-size:14px;
  opacity:0;pointer-events:none;transition:opacity .18s ease,transform .18s ease;z-index:60;
}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

.hidden{display:none !important}

/* ---------- Responsive ---------- */
@media (max-width:1080px){
  :root{--rail:270px}
}
@media (max-width:560px){
  .tbl-wrap .tbl{min-width:0}
  .tbl th,.tbl td{padding:8px 9px;font-size:13.5px}
  .tbl td.m{font-size:12.5px}
}
@media (max-width:860px){
  .wrap{display:block;padding:0 16px}
  .brand span{display:none}
  .top-right{display:none}
  .rail-tools .m-only{display:block}
  .rail{
    position:fixed;left:0;right:0;bottom:0;top:calc(var(--topH) + 3px);
    width:auto;max-height:none;background:var(--paper);
    z-index:35;padding:14px 16px 40px;overflow:auto;
  }
  .rail:not(.open){display:none}
  .main{padding:20px 0 80px;max-width:none}
  .menu-btn{display:inline-flex}
  .choices{grid-template-columns:1fr}
  .gate-progress{grid-template-columns:1fr}
  .fields{grid-template-columns:1fr}
  .domain-grid{grid-template-columns:1fr}
  .gate{padding:32px 4px 60px}
}

@media (prefers-reduced-motion:reduce){
  *{transition:none !important;animation:none !important}
}

/* ---------- Print ---------- */
@media print{
  .top,.rail,.pager,.toast,.cmd-h button{display:none !important}
  .wrap{display:block;padding:0}
  .main{max-width:none;padding:0}
  body{background:#fff;font-size:11.5pt}
  .step{page-break-after:always}
  .cmd pre{background:#fff;color:#000;border:1px solid #999}
  .cmd-h{background:#eee;color:#333}
  .ph{color:#000;font-weight:bold}

<body>
<header class="top">
  <div class="top-in">
    <button class="pill menu-btn" id="menuBtn" aria-expanded="false">Übersicht</button>
    <div class="brand"><b>HIN Gateway</b><span id="brandSub"></span></div>
    <div class="langs" id="langs" role="group" aria-label="Sprache / Language / Langue"></div>
    <div class="top-right">
      <button class="pill" id="variantBtn" hidden><span class="dot"></span><span id="variantLbl">–</span></button>
      <button class="pill" id="valuesBtn" hidden></button>
      <button class="pill" id="reportBtn" hidden></button>
    </div>
  </div>
  <div class="bar"><i id="topProg"></i></div>
</header>

<section class="gate" id="gate"></section>

<div class="wrap hidden" id="app">
  <aside class="rail" id="rail">
    <div class="prog">
      <div class="prog-h"><b id="progPct">0%</b><span id="progTxt"></span></div>
      <div class="prog-track"><i id="progBar"></i></div>
    </div>
    <nav id="nav" aria-label="Schritte"></nav>
    <div class="rail-tools" id="tools"></div>
  </aside>
  <main class="main" id="main" tabindex="-1"></main>
</div>

<dialog id="dlgValues">
  <div class="dlg-h"><h2 id="dlgValuesTitle"></h2><button class="x" data-close aria-label="×">&times;</button></div>
  <div class="dlg-b">
    <p id="dlgValuesIntro" style="margin:0 0 14px;font-size:14.5px;color:var(--ink-2)"></p>
    <div class="fields" id="fieldGrid"></div>
  </div>
  <div class="dlg-f"><span class="sp"></span><button class="btn" data-close id="btnDone"></button></div>
</dialog>

<dialog id="dlgRollback">
  <div class="dlg-h"><h2 id="dlgRollbackTitle"></h2><button class="x" data-close aria-label="×">&times;</button></div>
  <div class="dlg-b" id="dlgRollbackBody"></div>
  <div class="dlg-f"><span class="sp"></span><button class="btn ghost" data-close id="btnClose"></button></div>
</dialog>

<dialog id="dlgReport">
  <div class="dlg-h"><h2 id="dlgReportTitle"></h2><button class="x" data-close aria-label="×">&times;</button></div>
  <div class="dlg-b">
    <p id="dlgReportIntro" style="margin:0 0 12px;font-size:14.5px;color:var(--ink-2)"></p>
    <pre id="reportOut" style="font-family:var(--mono);font-size:12.5px;line-height:1.6;white-space:pre-wrap;background:var(--rule-soft);border:1px solid var(--rule);border-radius:8px;padding:12px;margin:0;max-height:44vh;overflow:auto"></pre>
  </div>
  <div class="dlg-f"><button class="btn" id="copyReport"></button><span class="sp"></span><button class="btn ghost" data-close id="btnClose2"></button></div>
</dialog>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

 {k:'h',mail:'onprem',t:'Exchange Server On-Premises'},{k:'note',mail:'onprem',tone:'info',title:'Three Exchange components',html:'<p>For Exchange Server 2016/2019, configure a <b>Send Connector</b> to the HIN Gateway, a <b>Receive Connector</b> from the HIN Gateway and a <b>Transport Rule</b> for external recipients.</p>'},{k:'h',mail:'onprem',t:'1. Send Connector – Exchange → HIN Gateway'},{k:'todo',mail:'onprem',items:['Mail flow → Send connectors opened','Connector “To HIN Gateway Relay” created or verified','Type “Internet” selected','Route via smart host {pubip}','Smart host authentication set to “None”','Address space set to * or the required external domains','Exchange transport server {exchange} selected as source server','Send connector configuration checked against the current HIN requirements']},{k:'cmd',mail:'onprem',where:'Exchange Management Shell (optional)',lines:['New-SendConnector -Name "To HIN Gateway Relay" `','  -AddressSpaces "SMTP:*;1" `','  -SmartHosts "{pubip}" `','  -SmartHostAuthMechanism None `','  -DNSRoutingEnabled $false `','  -SourceTransportServers "{exchange}"']},{k:'h',mail:'onprem',t:'2. Receive Connector – HIN Gateway → Exchange'},{k:'todo',mail:'onprem',items:['Mail flow → Receive connectors opened','Receive connector “From HIN Gateway Relay” created or verified','Frontend Transport used','Remote network settings restricted to HIN Gateway IP {pubip}','Authentication “Externally Secured” enabled','Permission group “Exchange servers” enabled']},{k:'cmd',mail:'onprem',where:'Exchange Management Shell (optional)',lines:['New-ReceiveConnector -Name "From HIN Gateway Relay" `','  -Bindings "0.0.0.0:25" `','  -RemoteIPRanges "{pubip}" `','  -TransportRole FrontendTransport `','  -Usage Custom `','  -AuthMechanism ExternalAuthoritative `','  -PermissionGroups ExchangeServers']},{k:'h',mail:'onprem',t:'3. Transport Rule – external mail via HIN Gateway'},{k:'todo',mail:'onprem',items:['Mail flow → Rules opened','Rule created for recipien ];

/* =====================================================================
   Logik / logic / logique
   ===================================================================== */

const TOKENS = {ip:'<IP>', prefix:'<PREFIX>', gw:'<GATEWAY>', dns:'<DNS>', pubip:'<PUBLIC-IP>', fqdn:'<FQDN>', nic:'<PROFILE>', exchange:'<EXCHANGE-SERVER>'};
const KEY = 'hin.gateway.assistent.v3.scenarios';
const LANGS = ['de','en','fr'];

/* Speicher: localStorage wenn verfügbar, sonst im Arbeitsspeicher */
const store = (() => {
  let mem = {}, ok = true;
  try { const t='__t'; localStorage.setItem(t,'1'); localStorage.removeItem(t); }
  catch(e){ ok = false; }
  return {
    get(k){ try { return ok ? localStorage.getItem(k) : (mem[k] ?? null); } catch(e){ return mem[k] ?? null; } },
    set(k,v){ try { ok ? localStorage.setItem(k,v) : (mem[k]=v); } catch(e){ mem[k]=v; } },
    del(k){ try { ok ? localStorage.removeItem(k) : delete mem[k]; } catch(e){ delete mem[k]; } }
  };
})();

function guessLang(){
  const nav = (navigator.languages || [navigator.language || 'de']).map(x => String(x).slice(0,2).toLowerCase());
  for (const l of nav) if (LANGS.includes(l)) return l;
  return 'de';
}

function blankDomain(){ return {name:'', inbound:'', outbound:'', sec:'', headers:''}; }
let S = {lang:null, mailMode:null, platform:null, variant:null, domainMode:'single', strategy:'all', domains:[blankDomain()], checks:{}, na:{}, values:{}, valuesPrompted:false, cur:0};
try { const raw = store.get(KEY); if (raw) S = Object.assign(S, JSON.parse(raw)); } catch(e){}
if (!LANGS.includes(S.lang)) S.lang = guessLang();
if (!S.checks || typeof S.checks!=='object') S.checks = {};
if (!S.na || typeof S.na!=='object') S.na = {};
if (!S.values || typeof S.values!=='object') S.values = {};
if (typeof S.valuesPrompted !== 'boolean') S.valuesPrompted = false;
if (!['m365','onprem','other'].includes(S.mailMode)) S.mailMode = null;
if (!['azure','vmware','proxmox','windows','cloudscale'].includes(S.platform)) S.platform = null;
if (!['single','multi'].includes(S.domainMode)) S.domainMode = 'single';
if (!['all','gradual'].includes(S.strategy)) S.strategy = 'all';
if (!Array.isArray(S.domains) || !S.domains.length) S.domains = [blankDomain()];
S.domains = S.domains.map(d=>Object.assign(blankDomain(), d||{}));
if (S.values.domain && !S.domains[0].name) { S.domains[0].name = S.values.domain; delete S.values.domain; }
if (S.domainMode==='single' && S.domains.length>1) S.domains = [S.domains[0]];
if (S.domainMode==='multi' && S.domains.length<2) S.domains.push(blankDomain());
if (S.mailMode==='onprem') { S.domainMode='single'; S.strategy='all'; S.domains=[S.domains[0]||blankDomain()]; }
if (S.strategy==='gradual') S.variant='B';
const save = () => store.set(KEY, JSON.stringify(S));

let T, FIELDS, PHASES, STEPS;
function useLang(l){
  S.lang = LANGS.includes(l) ? l : 'de';
  T = UI[S.lang];
  const c = CONTENT[S.lang];
  FIELDS = c.FIELDS; PHASES = c.PHASES; STEPS = c.STEPS;
  document.documentElement.lang = S.lang;
}

const $  = s => document.querySelector(s);
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const t = (key, vars) => String(T[key] || '').replace(/\{(\w+)\}/g, (m,k) => (vars && k in vars) ? vars[k] : m);

/* Platzhalter {feld} -> Wert oder Token */
function fill(str, asHtml){
  return String(str).replace(/\{(\w+)\}/g, (m, k) => {
    if (!(k in TOKENS)) return m;
    const v = (S.values[k] || '').trim();
    if (!asHtml) return v || TOKENS[k];
    return v ? '<span class="ph set">'+esc(v)+'</span>'
             : '<span class="ph">'+esc(TOKENS[k])+'</span>';
  });
}
function applies(o){
  if (!o) return true;
  if (o.v && o.v !== S.variant) return false;
  if (o.dm && o.dm !== S.domainMode) return false;
  if (o.strategy && o.strategy !== S.strategy) return false;
  if (o.mail && o.mail !== S.mailMode) return false;
  if (o.platform && o.platform !== S.platform) return false;
  return true;
}
const variantLabel = () => S.variant === 'A' ? T.variantA : T.variantB;
function mailModeLabel(){ return S.mailMode==='m365' ? T.mailM365 : (S.mailMode==='onprem' ? T.mailOnPrem : T.mailOther); }
function platformLabel(){ const k={azure:'platformAzure',vmware:'platformVMware',proxmox:'platformProxmox',windows:'platformWindows',cloudscale:'platformCloudscale'}[S.platform]; return k ? T[k] : '—'; }

const domainName = i => ((S.domains[i]&&S.domains[i].name)||'').trim() || t('domainFallback',{n:i+1});
function fillDomain(str, di, asHtml){
  const d = S.domains[di] || blankDomain();
  const vals = {domain:domainName(di), inbound:d.inbound||'<INBOUND-RELAY>', outbound:d.outbound||'<OUTBOUND-RELAY>', headers:d.headers||'<HEADERS>'};
  let x = String(str).replace(/\{(domain|inbound|outbound|headers)\}/g,(m,k)=>vals[k]);
  return fill(x, asHtml);
}
function visibleIndexes(){ return STEPS.map((s,i)=>applies(s)?i:null).filter(i=>i!==null); }
function ensureCurVisible(){ const vis=visibleIndexes(); if (!vis.length) return; if (!vis.includes(S.cur)) S.cur=vis[0]; }

/* ---------- Rendering ---------- */
function cmdHTML(b, id){
  const body = b.lines.map(l => {
    let h = fill(esc(l), true);
    h = h.replace(/&lt;([A-Za-z0-9_\- ]+)&gt;/g, '<span class="ph">&lt;$1&gt;</span>');
    return /^\s*#/.test(l) ? '<span class="c">'+h+'</span>' : h;
  }).join('\n');
  return '<div class="cmd"><div class="cmd-h"><span class="where">'+esc(b.where||T.terminal)+'</span>'+
         '<button data-copy="'+id+'">'+esc(T.copy)+'</button></div>'+
         '<pre id="'+id+'">'+body+'</pre></div>';
}

function domainSummaryHTML(){
  const rows = S.domains.map((d,i)=>'<tr><td><span class="domain-badge">'+esc(String(i+1))+'</span>'+esc(domainName(i))+'</td><td>'+esc(d.inbound||'—')+'</td><td>'+esc(d.outbound||'—')+'</td><td>'+esc(d.sec==='yes'?T.secYes:(d.sec==='no'?T.secNo:T.secUnknown))+'</td></tr>').join('');
  return '<div class="tbl-wrap"><table class="tbl"><thead><tr><th>'+esc(T.fldDomain)+'</th><th>'+esc(T.fldInbound)+'</th><th>'+esc(T.fldOutbound)+'</th><th>'+esc(T.fldSec)+'</th></tr></thead><tbody>'+rows+'</tbody></table></div><p><button class="btn ghost" id="valuesBtnStep">'+esc(T.toolValues)+'</button></p>';
}

function blockHTML(b, si, bi){
  if (!applies(b)) return '';
  switch(b.k){
    case 'h':  return '<h2>'+fill(esc(b.t), true)+'</h2>';
    case 'p':  return '<p>'+fill(b.html, true)+'</p>';
    case 'ul': return '<ul class="plain">'+b.items.filter(applies).map(i =>
                 '<li>'+fill(typeof i==='string'?i:i.t, true)+'</li>').join('')+'</ul>';
    case 'ol': return '<ol class="plain" style="padding-left:20px">'+b.items.map(i =>
                 '<li style="margin:5px 0">'+fill(i, true)+'</li>').join('')+'</ol>';
    case 'note': return '<div class="note '+(b.tone||'info')+'">'+
                 (b.title?'<b>'+esc(b.title)+'</b>':'')+fill(b.html, true)+'</div>';
    case 'cmd': return cmdHTML(b, 'c'+si+'_'+bi);
    case 'nets': return '<div class="nets">'+b.items.map(n=>'<code>'+esc(n)+'</code>').join('')+

          return '<li class="'+(isNA?'na':'')+'"><div class="task-row"><label><input type="checkbox" data-task="'+id+'"'+(S.checks[id]?' checked':'')+'><span class="txt">'+fillDomain(esc(txt),di,true)+'</span></label>'+naBtn+'</div></li>';
        }).join('')+'</ul>';
      }).join('');

    case 'todo': {

      if (!items.length) return '';

        const id = si+'.'+bi+'.'+ii, txt = typeof it==='string'?it:it.t;

function stepHTML(s, i){
  if(!applies(s)) return '';
  const phase = PHASES.find(p=>p.id===s.ph);
  const numeric = /^\d+$/.test(s.n);
  const pname = phase ? phase.name.replace(/^(Teil|Part|Partie) \d+ · /, '') : '';
  return '<article class="step" id="schritt-'+s.n+'">'+
    '<p class="crumb"><span class="num">'+(numeric ? esc(t('stepWord',{n:s.n})) : esc(T.finalWord))+'</span>'+
    (pname ? ' &middot; '+esc(pname) : '')+'</p>'+
    '<h1>'+esc(s.title)+'</h1>'+
    (s.lead?'<p class="lead">'+esc(s.lead)+'</p>':'')+
    s.blocks.map((b,bi)=>blockHTML(b,i,bi)).join('')+
    '</article>';
}

/* sichtbare Aufgaben eines Schritts */
function stepTasks(s, i){
  const out = [];
  if (!applies(s)) return out;
  s.blocks.forEach((b,bi)=>{
    if (!applies(b)) return;
    if (b.k==='todo'){
      b.items.forEach((it,ii)=>{
        if (!applies(typeof it==='string'?null:it)) return;
        out.push({id:i+'.'+bi+'.'+ii, txt:(typeof it==='string'?it:it.t), naAllowed:(typeof it!=='string'&&!!it.na)});
      });
    }
    if (b.k==='domainTodo'){
      S.domains.forEach((d,di)=>b.items.forEach((it,ii)=>{
        if (!applies(typeof it==='string'?null:it)) return;
        const raw=(typeof it==='string'?it:it.t);
        out.push({id:i+'.'+bi+'.d'+di+'.'+ii, txt:domainName(di)+': '+fillDomain(raw,di,false), naAllowed:(typeof it!=='string'&&!!it.na)});
      }));
    }
  });
  return out;
}

function renderNav(){
  let html = '', last = null;
  STEPS.forEach((s,i)=>{
    if (!applies(s)) return;
    if (s.ph !== last){
      if (last!==null) html += '</ul>';
      const p = PHASES.find(x=>x.id===s.ph);
      html += '<div class="phase-h"><em>'+esc(p.name)+'</em></div><ul class="nav">';
      last = s.ph;
    }
    if (s.cut) html += '</ul><div class="cutline"><span>'+esc(T.cutline)+'</span></div><ul class="nav">';
    const tk = stepTasks(s,i), done = tk.filter(x=>S.checks[x.id] || S.na[x.id]).length;
    const all = tk.length>0 && done===tk.length;
    html += '<li><button data-go="'+i+'" class="'+(all?'done':'')+'" aria-current="'+(i===S.cur)+'">'+
      '<span class="n">'+(all?'✓':esc(s.n))+'</span><span class="lbl">'+esc(s.title)+
      (tk.length?'<span class="cnt">'+done+'/'+tk.length+'</span>':'')+'</span></button></li>';
  });
  $('#nav').innerHTML = html + '</ul>';
}

  S.variant = (S.strategy==='gradual' ? 'B' : v);
  const shouldPromptValues = promptValues && !S.valuesPrompted;
  if (shouldPromptValues) S.valuesPrompted = true;
  ensureCurVisible(); save();

  render();
  window.scrollTo(0,0);
  if (shouldPromptValues){
    renderFields();
    setTimeout(() => $('#dlgValues').showModal(), 0);
  }
}

/* ---------- Protokoll ---------- */
function report(){
  const L = [];
  L.push(T.repTitle);
  L.push(T.repCreated+T.colon+new Date().toLocaleString(T.locale));
  L.push(T.repMailMode+T.colon+(S.mailMode==='m365'?T.repMailM365:(S.mailMode==='onprem'?T.repMailOnPrem:T.repMailOther)));
  L.push(T.repPlatform+T.colon+platformLabel());
  L.push(T.repVariant+T.colon+(S.variant==='A'?T.repVariantA:T.repVariantB));
  L.push(T.repDomainMode+T.colon+(S.domainMode==='multi'?T.repDomainMulti:T.repDomainSingle));
  if(S.domainMode==='multi') L.push(T.repStrategy+T.colon+(S.strategy==='gradual'?T.repStrategyGradual:T.repStrategyAll));
  let d=0, n=0;
  STEPS.forEach((s,i)=>{if(!applies(s))return; const x=stepTasks(s,i); n+=x.length; d+=x.filter(y=>S.checks[y.id] || S.na[y.id]).length;});
  L.push(t('repProgress',{d:d,t:n}));
  L.push('');
  const vals = FIELDS.filter(f=>(!f.mail || f.mail===S.mailMode) && (S.values[f.id]||'').trim());
  if (vals.length){ L.push(T.repValues); vals.forEach(f=>L.push('  '+f.label+T.colon+S.values[f.id].trim())); L.push(''); }
  L.push(T.repDomains); S.domains.forEach((d,i)=>{L.push('  '+domainName(i)); if(d.inbound)L.push('    '+T.fldInbound+T.colon+d.inbound); if(d.outbound)L.push('    '+T.fldOutbound+T.colon+d.outbound); if(d.headers)L.push('    '+T.fldHeaders+T.colon+d.headers);}); L.push('');
  const naItems = [];
  STEPS.forEach((s,i)=>{ if(!applies(s))return; stepTasks(s,i).filter(y=>S.na[y.id]).forEach(y=>naItems.push({s,y})); });
  if (naItems.length){
    L.push(T.repNA);
    let last = null;
    naItems.forEach(({s,y})=>{
      const key = s.n+'|'+s.title;
      if (key!==last){ L.push('  '+(/^\d+$/.test(s.n) ? t('repStep',{n:s.n,t:s.title}) : t('repFinal',{t:s.title}))); last=key; }
      L.push('    ['+T.naMarker+'] '+fill(y.txt,false));
    });
    L.push('');
  }
  L.push(T.repOpen);
  let open=0;
  STEPS.forEach((s,i)=>{
    if(!applies(s)) return;
    const x = stepTasks(s,i).filter(y=>!S.checks[y.id] && !S.na[y.id]);
    if (!x.length) return;
    open += x.length;
    L.push('  '+(/^\d+$/.test(s.n) ? t('repStep',{n:s.n,t:s.title}) : t('repFinal',{t:s.title})));
    x.forEach(y=>L.push('    [ ] '+fill(y.txt,false)));
  });
  if (!open) L.push('  '+T.repNone);
  return L.join('\n');
}

/* ---------- Kopieren ---------- */
function copyText(txt, msg){
  const done = () => toast(msg);
  if (navigator.clipboard && window.isSecureContext){
    navigator.clipboard.writeText(txt).then(done, ()=>fallback(txt,done));
  } else fallback(txt, done);
}
function fallback(txt, cb){
  const ta = document.createElement('textarea');
  ta.value = txt; ta.style.position='fixed'; ta.style.opacity='0';
  document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); cb(); } catch(e){ toast(T.copyFail); }
  ta.remove();
}
let tT;
function toast(m){
  const el = $('#toast'); el.textContent = m; el.classList.add('on');
  clearTimeout(tT); tT = setTimeout(()=>el.classList.remove('on'), 1800);
}

/* ---------- Events ---------- */
document.addEventListener('click', e => {
  const lg = e.target.closest('[data-lang]');
  if (lg) { setLang(lg.dataset.lang); return; }

  const mm = e.target.closest('[data-mail-mode]');
  if (mm) {
    S.mailMode = mm.dataset.mailMode;
    if (S.mailMode==='onprem') { S.domainMode='single'; S.strategy='all'; S.domains=[S.domains[0]||blankDomain()]; }
    save(); renderGate(); scrollGateQuestion(2); return;
  }


  const pf = e.target.closest('[data-platform]');
  if (pf) { S.platform = pf.dataset.platform; save(); renderGate(); scrollGateQuestion(3); return; }

  const c = e.target.closest('.choice[data-variant]');
  if (c) { setVariant(c.dataset.variant); return; }

  const dm = e.target.closest('[data-domain-mode]');
  if (dm){
    if (S.mailMode==='onprem' && dm.dataset.domainMode==='multi') return;
    S.domainMode = dm.dataset.domainMode;
    if(S.domainMode==='single') { S.domains=[S.domains[0]||blankDomain()]; S.strategy='all'; }
    else if(S.domains.length<2) S.domains.push(blankDomain());
    save(); renderFields(); return;
  }
  const st = e.target.closest('[data-strategy]');
  if (st){
    S.strategy = st.dataset.strategy;
    if(S.strategy==='gradual') S.variant='B';
    save(); renderFields(); return;
  }
  const rm = e.target.closest('[data-remove-domain]');
  if(rm){ const i=+rm.dataset.removeDomain; if(S.domains.length>1) S.domains.splice(i,1); save(); renderFields(); return; }

  const go = e.target.closest('[data-go]');
  if (go) { goto(+go.dataset.go); return; }

  const na = e.target.closest('[data-na]');
  if (na) {
    const id = na.dataset.na, on = !S.na[id];
    if (on) { S.na[id] = true; delete S.checks[id]; }
    else delete S.na[id];
    save();
    const li = na.closest('li'); if (li) li.classList.toggle('na', on);
    na.classList.toggle('on', on); na.setAttribute('aria-pressed', String(on));
    const cb = li ? li.querySelector('[data-task]') : null; if (cb && on) cb.checked = false;
    renderNav(); renderProgress();
    return;
  }

  const cp = e.target.closest('[data-copy]');
  if (cp) { copyText(document.getElementById(cp.dataset.copy).innerText, T.copied); return; }

  const cn = e.target.closest('[data-copynets]');
  if (cn) {
    const [si,bi] = cn.dataset.copynets.split('_').map(Number);
    copyText(STEPS[si].blocks[bi].items.join('\n'), T.netsCopied); return;
  }

  if (e.target.closest('[data-close]')) { e.target.closest('dialog').close(); return; }

  const btn = e.target.closest('button[id]');
  const id = btn ? btn.id : '';
  if (id==='mailModeBtn'){ S.variant=null; save(); $('#app').classList.add('hidden'); $('#gate').classList.remove('hidden'); ['variantBtn','valuesBtn','reportBtn'].forEach(x=>$('#'+x).hidden=true); renderGate(); window.scrollTo(0,0); return; }
  if (id==='addDomainBtn'){ if(S.mailMode==='onprem') return; S.domains.push(blankDomain()); S.domainMode='multi'; save(); renderFields(); return; }
  if (id==='valuesBtn' || id==='valuesBtn2' || id==='valuesBtnStep'){ renderFields(); $('#dlgValues').showModal(); }
  if (id==='rollbackBtn'){ $('#dlgRollback').showModal(); }
  if (id==='reportBtn' || id==='reportBtn2' || id==='reportBtn3'){ $('#reportOut').textContent = report(); $('#dlgReport').showModal(); }
  if (id==='copyReport'){ copyText(report(), T.reportCopied); }
  if (id==='variantBtn' || id==='variantBtn2'){ setVariant(S.variant==='A'?'B':'A'); toast(variantLabel()); }
  if (id==='menuBtn'){
    const r = $('#rail'), open = r.classList.toggle('open');
    btn.setAttribute('aria-expanded', String(open));
  }
  if (id==='printBtn'){
    $('#main').innerHTML = STEPS.map((s,i)=>applies(s)?stepHTML(s,i):'').join('');
    window.print();
  }
  if (id==='resetBtn'){
    if (confirm(T.resetConfirm)){
      store.del(KEY);
      S = {lang:S.lang, mailMode:null, platform:null, variant:null, domainMode:'single', strategy:'all', domains:[blankDomain()], checks:{}, na:{}, values:{}, valuesPrompted:false, cur:0};
      $('#app').classList.add('hidden'); $('#gate').classList.remove('hidden');
      ['variantBtn','valuesBtn','reportBtn'].forEach(x=>$('#'+x).hidden=true);
      $('#topProg').style.width='0%';
      renderGate(); window.scrollTo(0,0);
    }
  }
});

document.addEventListener('change', e => {
  const tk = e.target.closest('[data-task]');
  if (tk){
    const id = tk.dataset.task;
    S.checks[id] = tk.checked;
    if (tk.checked) delete S.na[id];
    save();
    const li = tk.closest('li'); if (li && tk.checked) li.classList.remove('na');
    const naBtn = li ? li.querySelector('[data-na]') : null;
    if (naBtn && tk.checked){ naBtn.classList.remove('on'); naBtn.setAttribute('aria-pressed','false'); }
    renderNav(); renderProgress(); return;
  }
  const df = e.target.closest('[data-domain-field]');
  if(df){ const i=+df.dataset.domainIndex; if(!S.domains[i])S.domains[i]=blankDomain(); S.domains[i][df.dataset.domainField]=df.value; save(); return; }
  const f = e.target.closest('[data-field]');
  if (f){ S.values[f.dataset.field] = f.value; save(); }
});
document.addEventListener('input', e => {
  const df = e.target.closest('[data-domain-field]');
  if(df){ const i=+df.dataset.domainIndex; if(!S.domains[i])S.domains[i]=blankDomain(); S.domains[i][df.dataset.domainField]=df.value; save(); return; }
  const f = e.target.closest('[data-field]');
  if (f){ S.values[f.dataset.field] = f.value; save(); }
});
$('#dlgValues').addEventListener('close', () => { if (S.variant) render(); });
window.addEventListener('afterprint', () => { if (S.variant) render(); });

/* ---------- Kopfhöhe für die fixierte Übersicht ---------- */
function topH(){
  document.documentElement.style.setProperty('--topH', $('.top').offsetHeight + 'px');
}
window.addEventListener('resize', topH);

/* ---------- Start ---------- */
useLang(S.lang);
renderChrome();
renderGate();
if (S.variant && S.mailMode && S.platform) {
  setVariant(S.variant, false);
  const h = location.hash.match(/^#schritt-(.+)$/);
  if (h){ const i = STEPS.findIndex(s=>s.n===decodeURIComponent(h[1])); if (i>=0 && applies(STEPS[i])) goto(i); }
}
topH();
</script>
</body>
</html>
